    }

    function importDatabase(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (Array.isArray(data)) {
            reports = data;
            pushHistory();
            renderReportList();
            alert('データベースを読み込みました。');
          }
        } catch (err) {
          alert('ファイルの読み込みに失敗しました。');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    function getActiveReport() {
      return reports.find(r => r.id === currentReportId);
    }

    function loadReportToEditor(id, shouldRenderList = true) {
      const rep = getActiveReport();
      if (!rep) return;
      document.getElementById('report-tags').value = rep.tags ? rep.tags.join(', ') : '';
      renderCards();
      if (shouldRenderList) renderReportList();
    }

    function updateCurrentTags() {
      const rep = getActiveReport();
      if (!rep) return;
      const val = document.getElementById('report-tags').value;
      rep.tags = val.split(',').map(s => s.trim()).filter(s => s);
      pushToFront(rep.id);
      pushHistory();
      renderReportList();
    }

    function isRightAlignedValue(val) {
      if (!val) return false;
      const trimmed = val.trim();
      const numPattern = /^[\$￥¥]?[+-]?[\d,]+(\.\d+)?%?円?$/;
      const datePattern = /^\d{4}[\/\.-]\d{1,2}[\/\.-]\d{1,2}$/;
      return numPattern.test(trimmed) || datePattern.test(trimmed);
    }

    /* 付箋カードの描画ロジック */
    function renderCards() {
      const rep = getActiveReport();
      const container = document.getElementById('card-list');
      container.innerHTML = '';
      if (!rep) return;

      rep.cards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        const isActive = (card.id === activeCardId);
        cardEl.className = `card ${isActive ? 'is-active' : ''} ${card.underline ? 'has-underline' : ''}`;
        cardEl.setAttribute('data-type', card.type);
        cardEl.id = `card-${card.id}`;

        cardEl.onclick = (e) => {
          e.stopPropagation();
          if (activeCardId !== card.id) {
            activeCardId = card.id;
            renderCards();
          }
        };

        let bodyHtml = '';

        if (!isActive) {
          if (card.type === 'title') {
            bodyHtml = `<div class="view-content">${escapeHtml(card.text)}</div>`;
          } else if (card.type === 'datetime') {
            let dt = card.text || '';
            if (card.assignee) dt += ` ${card.assignee}`;
            bodyHtml = `<div class="view-content">${escapeHtml(dt)}</div>`;
          } else if (card.type === 'text') {
            bodyHtml = `<div class="view-content">${escapeHtml(card.text)}</div>`;
          } else if (card.type === 'table') {
            bodyHtml = renderViewTable(card);
          } else if (card.type === 'image') {
            bodyHtml = renderViewImage(card);
          }
        } else {
          if (card.type === 'title') {
            bodyHtml = `
              <input type="text" value="${escapeHtml(card.text)}" oninput="updateCardText('${card.id}', this.value)" style="text-align: center; font-weight: bold;">
              <label style="font-size:calc(var(--ui-font-size) * 0.8); margin-top:4px; display:inline-block;">
                <input type="checkbox" ${card.underline ? 'checked' : ''} onchange="toggleUnderline('${card.id}', this.checked)"> 下線をつける
              </label>
            `;
          } else if (card.type === 'datetime') {
            bodyHtml = `
              <div style="display:flex; gap:8px; margin-bottom:4px;">
                <input type="text" value="${escapeHtml(card.text)}" oninput="updateCardDateText('${card.id}', this.value)" style="flex:2;" placeholder="日時">
                <input type="text" value="${escapeHtml(card.assignee || '')}" oninput="updateCardAssignee('${card.id}', this.value)" style="flex:1;" placeholder="担当者名">
              </div>
              <label style="font-size:calc(var(--ui-font-size) * 0.8); display:inline-block;">
                <input type="checkbox" id="chk-auto-${card.id}" ${card.autoUpdate ? 'checked' : ''} onchange="toggleAutoUpdate('${card.id}', this.checked)"> リアルタイム自動更新
              </label>
            `;
          } else if (card.type === 'text') {
            bodyHtml = `<textarea oninput="updateCardText('${card.id}', this.value); autoResizeTextarea(this);">${escapeHtml(card.text)}</textarea>`;
          } else if (card.type === 'table') {
            let rowOpts = '';
            for (let i = 1; i <= 26; i++) {
              rowOpts += `<option value="${i}" ${i === card.rows ? 'selected' : ''}>${i}</option>`;
            }
            let colOpts = '';
            for (let i = 1; i <= 26; i++) {
              colOpts += `<option value="${i}" ${i === card.cols ? 'selected' : ''}>${i}</option>`;
            }

            bodyHtml = `
              <div style="display:flex; gap:6px; margin-bottom:6px; align-items:center; flex-wrap:wrap;">
                <label style="font-size:calc(var(--ui-font-size) * 0.8);">行:</label>
                <select onchange="changeTableSize('${card.id}', this.value, ${card.cols})" style="padding:2px 4px;">
                  ${rowOpts}
                </select>
                <label style="font-size:calc(var(--ui-font-size) * 0.8);">列:</label>
                <select onchange="changeTableSize('${card.id}', ${card.rows}, this.value)" style="padding:2px 4px;">
                  ${colOpts}
                </select>
                <div style="display:inline-flex; align-items:center; margin-left: auto; gap: 4px;">
                  <label style="font-size:calc(var(--ui-font-size) * 0.85); cursor:pointer; display:inline-flex; align-items:center; gap:2px;">
                    <input type="checkbox" ${card.isMergeMode ? 'checked' : ''} onchange="toggleMergeMode('${card.id}', this.checked)"> 結合
                  </label>
                  <button class="btn btn-sm btn-light" onclick="unmergeSelectedCell('${card.id}')">解除</button>
                </div>
              </div>
              ${renderEditableTable(card)}
            `;
          } else if (card.type === 'image') {
            const imgs = card.images || (card.src ? [card.src] : []);
            bodyHtml = `
              <div style="margin-bottom:6px; text-align: center;">
                <input type="file" accept="image/*" multiple onchange="handleImageUpload('${card.id}', this)" ${imgs.length >= 4 ? 'disabled' : ''}>
                <span style="font-size:calc(var(--ui-font-size) * 0.7); color:#64748b; display:block;">(最大4枚/横2列まで表示/自動圧縮)</span>
              </div>
              ${renderViewImage(card)}
            `;
          }
        }

        const canMerge = (index > 0 && rep.cards[index-1].type === 'text' && card.type === 'text');

        cardEl.innerHTML = `
          <div class="card-tools">
            <span class="card-label">${card.type} 付箋</span>
            <div class="card-actions">
              ${canMerge ? `<button class="btn btn-sm btn-primary" onclick="mergeCard(${index})">⤺ 合体</button>` : ''}
              <button class="btn btn-sm btn-light" onclick="moveCard(${index}, -1)">▲</button>
              <button class="btn btn-sm btn-light" onclick="moveCard(${index}, 1)">▼</button>
              <button class="btn btn-sm btn-danger" onclick="deleteCard('${card.id}')">✕</button>
            </div>
          </div>
          <div class="card-body">${bodyHtml}</div>
        `;
        container.appendChild(cardEl);
      });

      setTimeout(() => {
        document.querySelectorAll('.card-body textarea').forEach(ta => autoResizeTextarea(ta));
      }, 0);
    }

    /* ビューモード用テーブル描画 */
    function renderViewTable(card) {
      ensureSpans(card);
      let html = `<div class="table-wrapper view-mode"><table class="zaurus-table">`;
      
      const totalW = (card.colWidths && card.colWidths.length === card.cols) 
        ? card.colWidths.reduce((a, b) => a + b, 0) 
        : card.cols * 85;

      html += `<colgroup>`;
      for (let c = 0; c < card.cols; c++) {
        const w = (card.colWidths && card.colWidths[c]) ? card.colWidths[c] : 85;
        const pct = ((w / totalW) * 100).toFixed(2);
        html += `<col style="width:${pct}%;">`;
      }
      html += `</colgroup>`;

      for (let r = 0; r < card.rows; r++) {
        const h = (card.rowHeights && card.rowHeights[r]) ? card.rowHeights[r] : 'auto';
        html += `<tr style="height:${typeof h === 'number' ? h+'px' : h};">`;
        for (let c = 0; c < card.cols; c++) {
          const span = card.spans[r][c];
          if (span.h) continue;

          const val = (card.data[r] && card.data[r][c]) ? card.data[r][c] : '';
          const alignClass = getCellAlignmentClass(card, r, c, val);
          const rsAttr = span.rs > 1 ? ` rowspan="${span.rs}"` : '';
          const csAttr = span.cs > 1 ? ` colspan="${span.cs}"` : '';

          html += `<td class="${alignClass}"${rsAttr}${csAttr}>${escapeHtml(val)}</td>`;
        }
        html += `</tr>`;
      }
      html += `</table></div>`;
      return html;
    }

    /* 編集モード用テーブル描画 */
    function renderEditableTable(card) {
      ensureSpans(card);
      let html = `
        <div class="table-wrapper edit-mode" id="table-wrapper-${card.id}">
          <table class="zaurus-table">
      `;

      html += `<colgroup><col style="width:30px;">`;
      for (let c = 0; c < card.cols; c++) {
        const w = (card.colWidths && card.colWidths[c]) ? card.colWidths[c] : 85;
        html += `<col style="width:${w}px;">`;
      }
      html += `</colgroup>`;

      html += `<tr class="table-header-row"><th style="width:30px;"></th>`;
      for (let c = 0; c < card.cols; c++) {
        const colLabel = String.fromCharCode(65 + c);
        html += `<th class="table-header-btn" 
                     onclick="showJogMenu(event, '${card.id}', 'col', ${c})"
                     onpointerdown="startHeaderHold(event, '${card.id}', 'col', ${c})">${colLabel}</th>`;
      }
      html += `</tr>`;

      for (let r = 0; r < card.rows; r++) {
        const h = (card.rowHeights && card.rowHeights[r]) ? card.rowHeights[r] : 'auto';
        html += `<tr style="height:${typeof h === 'number' ? h+'px' : h};">`;
        html += `<td class="table-header-btn table-header-col" 
                     onclick="showJogMenu(event, '${card.id}', 'row', ${r})"
                     onpointerdown="startHeaderHold(event, '${card.id}', 'row', ${r})">${r + 1}</td>`;

        for (let c = 0; c < card.cols; c++) {
          const span = card.spans[r][c];
          if (span.h) continue;

          const val = (card.data[r] && card.data[r][c]) ? card.data[r][c] : '';
          const alignClass = getCellAlignmentClass(card, r, c, val);
          const rsAttr = span.rs > 1 ? ` rowspan="${span.rs}"` : '';
          const csAttr = span.cs > 1 ? ` colspan="${span.cs}"` : '';

          const isSelected = card.selectedCell && (card.selectedCell.r === r && card.selectedCell.c === c);
          const selStyle = isSelected ? 'outline: 2px solid #2563eb; background-color: #dbeafe;' : '';

          if (card.isMergeMode) {
            html += `<td class="${alignClass}"${rsAttr}${csAttr} style="padding:4px; cursor:pointer; ${selStyle}"
                         onclick="handleCellClickForMerge('${card.id}', ${r}, ${c})">
                      ${escapeHtml(val) || '&nbsp;'}
                     </td>`;
          } else {
            html += `<td class="${alignClass}"${rsAttr}${csAttr} style="padding:0; ${selStyle}"
                         onclick="selectCellForUnmerge('${card.id}', ${r}, ${c})">
                      <input type="text" value="${escapeHtml(val)}" 
                             style="border:none; width:100%; height:100%; padding:4px; font-size:var(--ui-font-size); text-align:inherit; background:transparent;"
                             oninput="updateTableCell('${card.id}', ${r}, ${c}, this.value)">
                     </td>`;
          }
        }
        html += `</tr>`;
      }
      html += `</table></div>`;
      return html;
    }

    function getCellAlignmentClass(card, r, c, val) {
      const colAlign = (card.colAligns && card.colAligns[c]) ? card.colAligns[c] : 'auto';
      const rowAlign = (card.rowAligns && card.rowAligns[r]) ? card.rowAligns[r] : 'auto';

      let align = 'align-left';
      if (colAlign === 'auto') {
        align = isRightAlignedValue(val) ? 'align-right' : 'align-left';
      } else {
        align = `align-${colAlign}`;
      }

      let valign = 'valign-middle';
      if (rowAlign !== 'auto') {
        valign = `valign-${rowAlign}`;
      }

      return `${align} ${valign}`;
    }

    function showJogMenu(e, cardId, type, index) {
      e.stopPropagation();
      const popup = document.getElementById('jog-popup');

      let options = [];
      if (type === 'col') {
        options = [
          { label: '自動配置', action: 'auto' },
          { label: '左寄せ', action: 'left' },
          { label: '中央寄せ', action: 'center' },
          { label: '右寄せ', action: 'right' },
          { label: '左に列を挿入', action: 'insertCol' },
          { label: '列を削除', action: 'deleteCol' }
        ];
      } else {
        options = [
          { label: '自動配置', action: 'auto' },
          { label: '上寄せ', action: 'top' },
          { label: '中央', action: 'middle' },
          { label: '下寄せ', action: 'bottom' },
          { label: '上に行を挿入', action: 'insertRow' },
          { label: '行を削除', action: 'deleteRow' }
        ];
      }

      popup.innerHTML = options.map(opt => {
        if (opt.action === 'insertCol') {
          return `<div onclick="insertColumn('${cardId}', ${index})">${opt.label}</div>`;
        } else if (opt.action === 'deleteCol') {
          return `<div onclick="deleteColumn('${cardId}', ${index})">${opt.label}</div>`;
        } else if (opt.action === 'insertRow') {
          return `<div onclick="insertRow('${cardId}', ${index})">${opt.label}</div>`;
        } else if (opt.action === 'deleteRow') {
          return `<div onclick="deleteRow('${cardId}', ${index})">${opt.label}</div>`;
        } else {
          return `<div onclick="applyAlignment('${cardId}', '${type}', ${index}, '${opt.action}')">${opt.label}</div>`;
        }
      }).join('');

      popup.style.left = `${e.clientX}px`;
      popup.style.top = `${e.clientY}px`;
      popup.style.bottom = 'auto';
      popup.style.display = 'block';
    }

    function applyAlignment(cardId, type, index, value) {
      const card = getActiveReport().cards.find(c => c.id === cardId);
      if (type === 'col') {
        if (!card.colAligns) card.colAligns = [];
        card.colAligns[index] = value;
      } else {
        if (!card.rowAligns) card.rowAligns = [];
        card.rowAligns[index] = value;
      }
      document.getElementById('jog-popup').style.display = 'none';
      pushHistory();
      renderCards();
    }

    /* 列の挿入 */
    function insertColumn(cardId, colIndex) {
      document.getElementById('jog-popup').style.display = 'none';
      const card = getActiveReport().cards.find(c => c.id === cardId);
      if (!card) return;
      if (card.cols >= 26) {
        alert("これ以上列を追加できません(最大26列)。");
        return;
      }

      ensureSpans(card);

      const midMergeSet = new Set();
      for (let r = 0; r < card.rows; r++) {
        for (let c = 0; c < card.cols; c++) {
          const span = card.spans[r][c];
          if (!span.h && span.cs > 1) {
            if (colIndex > span.mc && colIndex <= span.mc + span.cs - 1) {
              midMergeSet.add(`${span.mr},${span.mc}`);
            }
          }
        }
      }

      midMergeSet.forEach(key => {
        const [mr, mc] = key.split(',').map(Number);
        card.spans[mr][mc].cs += 1;
      });

      for (let r = 0; r < card.rows; r++) {
        card.data[r].splice(colIndex, 0, '');

        let isInsideMerge = false;
        let masterR = r, masterC = colIndex;

        if (colIndex > 0 && colIndex < card.cols) {
          const leftSpan = card.spans[r][colIndex - 1];
          const rightSpan = card.spans[r][colIndex];
          if (leftSpan.mr === rightSpan.mr && leftSpan.mc === rightSpan.mc) {
            isInsideMerge = true;
            masterR = leftSpan.mr;
            masterC = leftSpan.mc;
          }
        }

        const newSpan = isInsideMerge
          ? { rs: 1, cs: 1, h: true, mr: masterR, mc: masterC }
          : { rs: 1, cs: 1, h: false, mr: r, mc: colIndex };

        card.spans[r].splice(colIndex, 0, newSpan);
      }

      for (let r = 0; r < card.rows; r++) {
        for (let c = colIndex + 1; c <= card.cols; c++) {
          const span = card.spans[r][c];
          if (span.mc >= colIndex) {
            span.mc += 1;
          }
        }
      }

      card.cols += 1;
      if (!card.colWidths) card.colWidths = Array(card.cols - 1).fill(85);
      card.colWidths.splice(colIndex, 0, 85);

      if (!card.colAligns) card.colAligns = Array(card.cols - 1).fill('auto');
      card.colAligns.splice(colIndex, 0, 'auto');

      checkAndLimitTableWidth(card);
      pushHistory();
      renderCards();
    }

    /* 列の削除 */
    function deleteColumn(cardId, colIndex) {
      document.getElementById('jog-popup').style.display = 'none';
      const card = getActiveReport().cards.find(c => c.id === cardId);
      if (!card) return;
      if (card.cols <= 1) {
        alert("これ以上列を削除できません。");
        return;
      }

      ensureSpans(card);

      for (let r = 0; r < card.rows; r++) {
        const span = card.spans[r][colIndex];
        if (!span.h) {
          if (span.cs > 1) {
            const nextSpan = card.spans[r][colIndex + 1];
            nextSpan.h = false;
            nextSpan.rs = span.rs;
            nextSpan.cs = span.cs - 1;
            nextSpan.mr = r;
            nextSpan.mc = colIndex + 1;
            if (card.data[r][colIndex + 1] === '') {
              card.data[r][colIndex + 1] = card.data[r][colIndex];
            }
            for (let br = r; br < r + span.rs; br++) {
              for (let bc = colIndex + 1; bc < colIndex + span.cs; bc++) {
                card.spans[br][bc].mr = r;
                card.spans[br][bc].mc = colIndex + 1;
              }
            }
          }
        } else {
          const mr = span.mr;
          const mc = span.mc;
          const master = card.spans[mr][mc];
          if (master && master.cs > 1) {
            master.cs -= 1;
          }
        }
      }

      for (let r = 0; r < card.rows; r++) {
        card.data[r].splice(colIndex, 1);
        card.spans[r].splice(colIndex, 1);
      }

      card.cols -= 1;

      for (let r = 0; r < card.rows; r++) {
        for (let c = 0; c < card.cols; c++) {
          const s = card.spans[r][c];
          if (s.mc > colIndex) {
            s.mc -= 1;
          }
        }
      }

      if (card.colWidths) card.colWidths.splice(colIndex, 1);
      if (card.colAligns) card.colAligns.splice(colIndex, 1);

      checkAndLimitTableWidth(card);
      pushHistory();
      renderCards();
    }

    /* 行の挿入 */
    function insertRow(cardId, rowIndex) {
      document.getElementById('jog-popup').style.display = 'none';
      const card = getActiveReport().cards.find(c => c.id === cardId);
      if (!card) return;
      if (card.rows >= 26) {
        alert("これ以上行を追加できません(最大26行)。");
        return;
      }

      ensureSpans(card);

      const midMergeSet = new Set();
      for (let r = 0; r < card.rows; r++) {
        for (let c = 0; c < card.cols; c++) {
          const span = card.spans[r][c];
          if (!span.h && span.rs > 1) {
            if (rowIndex > span.mr && rowIndex <= span.mr + span.rs - 1) {
              midMergeSet.add(`${span.mr},${span.mc}`);
            }
          }
        }
      }

      midMergeSet.forEach(key => {
        const [mr, mc] = key.split(',').map(Number);
        card.spans[mr][mc].rs += 1;
      });

      const newRowData = Array(card.cols).fill('');
      const newRowSpans = [];

      for (let c = 0; c < card.cols; c++) {
        let isInsideMerge = false;
        let masterR = rowIndex, masterC = c;

        if (rowIndex > 0 && rowIndex < card.rows) {
          const topSpan = card.spans[rowIndex - 1][c];
          const bottomSpan = card.spans[rowIndex][c];
          if (topSpan.mr === bottomSpan.mr && topSpan.mc === bottomSpan.mc) {
            isInsideMerge = true;
            masterR = topSpan.mr;
            masterC = topSpan.mc;
          }
        }

        newRowSpans.push(isInsideMerge
          ? { rs: 1, cs: 1, h: true, mr: masterR, mc: masterC }
          : { rs: 1, cs: 1, h: false, mr: rowIndex, mc: c }
        );
      }

      card.data.splice(rowIndex, 0, newRowData);
      card.spans.splice(rowIndex, 0, newRowSpans);

      for (let r = rowIndex + 1; r <= card.rows; r++) {
        for (let c = 0; c < card.cols; c++) {
          const span = card.spans[r][c];
          if (span.mr >= rowIndex) {
            span.mr += 1;
          }
        }
      }

      card.rows += 1;
      if (!card.rowHeights) card.rowHeights = Array(card.rows - 1).fill(30);
      card.rowHeights.splice(rowIndex, 0, 30);

      if (!card.rowAligns) card.rowAligns = Array(card.rows - 1).fill('auto');
      card.rowAligns.splice(rowIndex, 0, 'auto');

      pushHistory();
      renderCards();
    }

    /* 行の削除 */
    function deleteRow(cardId, rowIndex) {
      document.getElementById('jog-popup').style.display = 'none';
      const card = getActiveReport().cards.find(c => c.id === cardId);
      if (!card) return;
      if (card.rows <= 1) {
        alert("これ以上行を削除できません。");
        return;
      }

      ensureSpans(card);

      for (let c = 0; c < card.cols; c++) {
        const span = card.spans[rowIndex][c];
        if (!span.h) {
          if (span.rs > 1) {
            const nextSpan = card.spans[rowIndex + 1][c];
            nextSpan.h = false;
            nextSpan.rs = span.rs - 1;
            nextSpan.cs = span.cs;
            nextSpan.mr = rowIndex + 1;
            nextSpan.mc = c;
            if (card.data[rowIndex + 1][c] === '') {
              card.data[rowIndex + 1][c] = card.data[rowIndex][c];
            }
            for (let br = rowIndex + 1; br < rowIndex + span.rs; br++) {
              for (let bc = c; bc < c + span.cs; bc++) {
                card.spans[br][bc].mr = rowIndex + 1;
                card.spans[br][bc].mc = c;
              }
            }
          }
        } else {
          const mr = span.mr;
          const mc = span.mc;
          const master = card.spans[mr][mc];
          if (master && master.rs > 1) {
            master.rs -= 1;
          }
        }
      }

      card.data.splice(rowIndex, 1);
      card.spans.splice(rowIndex, 1);

      card.rows -= 1;

      for (let r = 0; r < card.rows; r++) {
        for (let c = 0; c < card.cols; c++) {
          const s = card.spans[r][c];
          if (s.mr > rowIndex) {
            s.mr -= 1;
          }
        }
      }

      if (card.rowHeights) card.rowHeights.splice(rowIndex, 1);
      if (card.rowAligns) card.rowAligns.splice(rowIndex, 1);

      pushHistory();
      renderCards();
    }

    let holdTimer = null;
    let isResizing = false;

    function startHeaderHold(e, cardId, type, index) {
      const startX = e.clientX;
      const startY = e.clientY;
      const card = getActiveReport().cards.find(c => c.id === cardId);

      holdTimer = setTimeout(() => {
        isResizing = true;
        const guideCol = document.getElementById('guide-line-col');
        const guideRow = document.getElementById('guide-line-row');
        const tooltip = document.getElementById('resize-tooltip');

        if (type === 'col') guideCol.style.display = 'block';
        else guideRow.style.display = 'block';
        tooltip.style.display = 'block';

        const onPointerMove = (moveEv) => {
          if (!isResizing) return;
          const deltaX = moveEv.clientX - startX;
          const deltaY = moveEv.clientY - startY;

          if (type === 'col') {
            const currentW = (card.colWidths && card.colWidths[index]) ? card.colWidths[index] : 85;
            let newW = Math.max(20, currentW + deltaX);

            let otherWidthsSum = card.colWidths.reduce((sum, w, i) => i === index ? sum : sum + w, 0);
            if (otherWidthsSum + newW > MAX_TABLE_WIDTH_PX) {
              newW = Math.max(20, MAX_TABLE_WIDTH_PX - otherWidthsSum);
            }

            const mm = (newW / MM_TO_PX).toFixed(1);
            guideCol.style.left = `${moveEv.clientX}px`;
            tooltip.style.left = `${moveEv.clientX - 20}px`;
            tooltip.style.top = `${moveEv.clientY - 35}px`;
            tooltip.innerText = `${mm}mm`;
          } else {
            const currentH = (card.rowHeights && card.rowHeights[index]) ? card.rowHeights[index] : 30;
            const newH = Math.max(20, currentH + deltaY);
            const mm = (newH / MM_TO_PX).toFixed(1);
            guideRow.style.top = `${moveEv.clientY}px`;
            tooltip.style.left = `${moveEv.clientX + 10}px`;
            tooltip.style.top = `${moveEv.clientY - 25}px`;
            tooltip.innerText = `${mm}mm`;
          }
        };

        const onPointerUp = (upEv) => {
          clearTimeout(holdTimer);
          isResizing = false;
          guideCol.style.display = 'none';
          guideRow.style.display = 'none';
          tooltip.style.display = 'none';

          const deltaX = upEv.clientX - startX;
          const deltaY = upEv.clientY - startY;

          if (type === 'col') {
            if (!card.colWidths) card.colWidths = Array(card.cols).fill(85);
            let newW = Math.max(20, card.colWidths[index] + deltaX);
            let otherWidthsSum = card.colWidths.reduce((sum, w, i) => i === index ? sum : sum + w, 0);
            if (otherWidthsSum + newW > MAX_TABLE_WIDTH_PX) {
              newW = Math.max(20, MAX_TABLE_WIDTH_PX - otherWidthsSum);
            }
            card.colWidths[index] = newW;
          } else {
            if (!card.rowHeights) card.rowHeights = Array(card.rows).fill(30);
            card.rowHeights[index] = Math.max(20, card.rowHeights[index] + deltaY);
          }

          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);
          pushHistory();
          renderCards();
        };

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
      }, 400);

      const cancelHold = () => clearTimeout(holdTimer);
      e.target.addEventListener('pointerleave', cancelHold, { once: true });
    }

    /* セル結合・解除関連関数 */
    function toggleMergeMode(cardId, isChecked) {
      const card = getActiveReport().cards.find(c => c.id === cardId);
      if (!card) return;
      card.isMergeMode = isChecked;
      card.selectedCell = null;
      renderCards();
    }

    function selectCellForUnmerge(cardId, r, c) {
      const card = getActiveReport().cards.find(c => c.id === cardId);
      if (!card) return;
      card.selectedCell = { r, c };
    }

    function handleCellClickForMerge(cardId, r, c) {
      const card = getActiveReport().cards.find(c => c.id === cardId);
      if (!card) return;
      ensureSpans(card);

      if (!card.selectedCell) {
        card.selectedCell = { r, c };
        renderCards();
        return;
      }

      const first = card.selectedCell;
      const second = { r, c };

      if (first.r === second.r && first.c === second.c) {
        card.selectedCell = null;
        renderCards();
        return;
      }

      const span1 = card.spans[first.r][first.c];
      const span2 = card.spans[second.r][second.c];

      const m1 = { r: span1.mr, c: span1.mc };
      const m2 = { r: span2.mr, c: span2.mc };

      const masterSpan1 = card.spans[m1.r][m1.c];
      const masterSpan2 = card.spans[m2.r][m2.c];

      const r1_min = m1.r;
      const r1_max = m1.r + masterSpan1.rs - 1;
      const c1_min = m1.c;
      const c1_max = m1.c + masterSpan1.cs - 1;

      const r2_min = m2.r;
      const r2_max = m2.r + masterSpan2.rs - 1;
      const c2_min = m2.c;
      const c2_max = m2.c + masterSpan2.cs - 1;

      const bound_r_min = Math.min(r1_min, r2_min);
      const bound_r_max = Math.max(r1_max, r2_max);
      const bound_c_min = Math.min(c1_min, c2_min);
      const bound_c_max = Math.max(c1_max, c2_max);

      const boundCellsCount = (bound_r_max - bound_r_min + 1) * (bound_c_max - bound_c_min + 1);
      const r1CellsCount = masterSpan1.rs * masterSpan1.cs;
      const r2CellsCount = masterSpan2.rs * masterSpan2.cs;

      if (boundCellsCount !== r1CellsCount + r2CellsCount) {
        alert("結合した結果が長方形になるように実行してください");
        card.selectedCell = null;
        renderCards();
        return;
      }

      const t1 = (card.data[m1.r] && card.data[m1.r][m1.c]) ? card.data[m1.r][m1.c].trim() : '';
      const t2 = (card.data[m2.r] && card.data[m2.r][m2.c]) ? card.data[m2.r][m2.c].trim() : '';

      let mergedText = '';
      if (t1 && t2) {
        mergedText = `${t1}｜${t2}`;
      } else if (t1) {
        mergedText = t1;
      } else if (t2) {
        mergedText = t2;
      }

      const newRs = bound_r_max - bound_r_min + 1;
      const newCs = bound_c_max - bound_c_min + 1;

      for (let br = bound_r_min; br <= bound_r_max; br++) {
        for (let bc = bound_c_min; bc <= bound_c_max; bc++) {
          if (br === bound_r_min && bc === bound_c_min) {
            card.data[br][bc] = mergedText;
            card.spans[br][bc] = {
              rs: newRs,
              cs: newCs,
              h: false,
              mr: bound_r_min,
              mc: bound_c_min
            };
          } else {
            card.data[br][bc] = '';
            card.spans[br][bc] = {
              rs: 1,
              cs: 1,
              h: true,
              mr: bound_r_min,
              mc: bound_c_min
            };
          }
        }
      }

      card.isMergeMode = false;
      card.selectedCell = null;
      pushHistory();
      renderCards();
    }

    function unmergeSelectedCell(cardId) {
      const card = getActiveReport().cards.find(c => c.id === cardId);
      if (!card) return;
      ensureSpans(card);

      if (!card.selectedCell) {
        alert("解除したいセルを選択してください。");
        return;
      }

      const { r, c } = card.selectedCell;
      const currentSpan = card.spans[r][c];
      const mr = currentSpan.mr;
      const mc = currentSpan.mc;
      const masterSpan = card.spans[mr][mc];

      if (masterSpan.rs === 1 && masterSpan.cs === 1) {
        return;
      }

      const bound_r_min = mr;
      const bound_r_max = mr + masterSpan.rs - 1;
      const bound_c_min = mc;
      const bound_c_max = mc + masterSpan.cs - 1;

      const fullText = card.data[mr][mc] || '';

      for (let br = bound_r_min; br <= bound_r_max; br++) {
        for (let bc = bound_c_min; bc <= bound_c_max; bc++) {
          card.spans[br][bc] = {
            rs: 1,
            cs: 1,
            h: false,
            mr: br,
            mc: bc
          };
          if (br === mr && bc === mc) {
            card.data[br][bc] = fullText;
          } else {
            card.data[br][bc] = '';
          }
        }
      }

      card.selectedCell = null;
      pushHistory();
      renderCards();
    }

    function renderViewImage(card) {
      const imgs = card.images || (card.src ? [card.src] : []);
      if (imgs.length === 0) {
        return `<div class="image-placeholder">(画像未選択)</div>`;
      }

      const gridClass = `image-grid count-${imgs.length}`;
      let imgsHtml = `<div class="${gridClass}">`;
      imgs.forEach(src => {
        imgsHtml += `<img src="${src}">`;
      });
      imgsHtml += `</div>`;
      return imgsHtml;
    }

    function handleImageUpload(id, input) {
      if (!input.files || input.files.length === 0) return;
      const card = getActiveReport().cards.find(c => c.id === id);
      if (!card.images) card.images = card.src ? [card.src] : [];

      const remainingSlots = 4 - card.images.length;
      const filesToProcess = Array.from(input.files).slice(0, remainingSlots);

      let processedCount = 0;
      filesToProcess.forEach(file => {
        compressImage(file, (compressedBase64) => {
          card.images.push(compressedBase64);
          processedCount++;
          if (processedCount === filesToProcess.length) {
            pushHistory();
            renderCards();
          }
        });
      });
    }

    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width;
          let h = img.height;
          const maxLen = 800;

          if (w > maxLen || h > maxLen) {
            if (w > h) {
              h = Math.round((h * maxLen) / w);
              w = maxLen;
            } else {
              w = Math.round((w * maxLen) / h);
              h = maxLen;
            }
          }

          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          const compressedData = canvas.toDataURL('image/webp', 0.75);
          callback(compressedData);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = (el.scrollHeight + 2) + 'px';
    }

    function addCard(type) {
      const rep = getActiveReport();
      const newCard = { id: 'c_' + Date.now(), type: type };
      
      if (type === 'title') { 
        newCard.text = 'タイトル'; 
        newCard.underline = false; 
      }
      else if (type === 'datetime') {
        newCard.text = new Date().toLocaleString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
        newCard.assignee = '';
        newCard.autoUpdate = true;
      }
      else if (type === 'text') { 
        newCard.text = '新規テキスト'; 
      }
      else if (type === 'table') { 
        newCard.rows = 2; newCard.cols = 2;
        newCard.data = [['',''],['','']]; 
        newCard.colAligns = ['auto','auto']; newCard.rowAligns = ['auto','auto'];
        newCard.colWidths = [85, 85]; newCard.rowHeights = [30, 30];
        newCard.spans = [
          [{rs:1,cs:1,h:false,mr:0,mc:0},{rs:1,cs:1,h:false,mr:0,mc:1}],
          [{rs:1,cs:1,h:false,mr:1,mc:0},{rs:1,cs:1,h:false,mr:1,mc:1}]
        ];
      }
      else if (type === 'image') { 
        newCard.images = []; 
      }

      rep.cards.push(newCard);
      activeCardId = newCard.id;
      pushToFront(rep.id);
      pushHistory();
      renderCards();

      setTimeout(() => {
        const newCardEl = document.getElementById(`card-${newCard.id}`);
        if (newCardEl) {
          const inputEl = newCardEl.querySelector('input[type="text"], textarea');
          if (inputEl) inputEl.focus();
        }
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }, 50);
    }

    function deleteCard(cardId) {
      const rep = getActiveReport();
      rep.cards = rep.cards.filter(c => c.id !== cardId);
      if (activeCardId === cardId) activeCardId = null;
      pushHistory();
      renderCards();
    }

    function moveCard(index, dir) {
      const rep = getActiveReport();
      const target = index + dir;
      if (target < 0 || target >= rep.cards.length) return;
      const temp = rep.cards[index];
      rep.cards[index] = rep.cards[target];
      rep.cards[target] = temp;
      pushHistory();
      renderCards();
    }

    function mergeCard(index) {
      const rep = getActiveReport();
      const prevCard = rep.cards[index - 1];
      const currentCard = rep.cards[index];
      prevCard.text += '\n' + currentCard.text;
      rep.cards.splice(index, 1);
      pushHistory();
      renderCards();
    }

    function updateCardText(id, val) {
      const card = getActiveReport().cards.find(c => c.id === id);
      if (card) {
        card.text = val;
        renderReportList();
      }
    }

    function updateCardDateText(id, val) {
      const card = getActiveReport().cards.find(c => c.id === id);
      if (card) {
        card.text = val;
        card.autoUpdate = false;
        const chk = document.getElementById(`chk-auto-${id}`);
        if (chk) chk.checked = false;
        renderReportList();
      }
    }

    function updateCardAssignee(id, val) {
      const card = getActiveReport().cards.find(c => c.id === id);
      if (card) card.assignee = val;
    }

    function toggleUnderline(id, val) {
      const card = getActiveReport().cards.find(c => c.id === id);
      if (card) { card.underline = val; pushHistory(); renderCards(); }
    }

    function toggleAutoUpdate(id, val) {
      const card = getActiveReport().cards.find(c => c.id === id);
      if (card) { card.autoUpdate = val; pushHistory(); }
    }

    function updateLiveDateTimes() {
      const rep = getActiveReport();
      if (!rep) return;
      rep.cards.forEach(c => {
        if (c.type === 'datetime' && c.autoUpdate) {
          c.text = new Date().toLocaleString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
        }
      });
      const dtCard = rep.cards.find(c => c.type === 'datetime');
      if (dtCard && dtCard.autoUpdate) {
        const inputEl = document.querySelector(`.card[data-type="datetime"] input[placeholder*="日時"]`);
        if (inputEl) inputEl.value = dtCard.text;
        renderReportList();
      }
    }

    function changeTableSize(id, rows, cols) {
      const card = getActiveReport().cards.find(c => c.id === id);
      card.rows = Math.max(1, Math.min(26, parseInt(rows)));
      card.cols = Math.max(1, Math.min(26, parseInt(cols)));
      
      if (!card.colWidths) card.colWidths = [];
      while (card.colWidths.length < card.cols) card.colWidths.push(85);
      card.colWidths = card.colWidths.slice(0, card.cols);

      if (!card.rowHeights) card.rowHeights = [];
      while (card.rowHeights.length < card.rows) card.rowHeights.push(30);
      card.rowHeights = card.rowHeights.slice(0, card.rows);

      if (!card.colAligns) card.colAligns = [];
      while (card.colAligns.length < card.cols) card.colAligns.push('auto');
      card.colAligns = card.colAligns.slice(0, card.cols);

      if (!card.rowAligns) card.rowAligns = [];
      while (card.rowAligns.length < card.rows) card.rowAligns.push('auto');
      card.rowAligns = card.rowAligns.slice(0, card.rows);

      const newData = [];
      const newSpans = [];
      for (let r = 0; r < card.rows; r++) {
        const rowData = [];
        const rowSpans = [];
        for (let c = 0; c < card.cols; c++) {
          rowData.push((card.data[r] && card.data[r][c] !== undefined) ? card.data[r][c] : '');
          if (card.spans && card.spans[r] && card.spans[r][c]) {
            rowSpans.push(card.spans[r][c]);
          } else {
            rowSpans.push({ rs: 1, cs: 1, h: false, mr: r, mc: c });
          }
        }
        newData.push(rowData);
        newSpans.push(rowSpans);
      }
      card.data = newData;
      card.spans = newSpans;
      ensureSpans(card);
      
      checkAndLimitTableWidth(card);

      pushHistory();
      renderCards();
    }

    function updateTableCell(id, r, c, val) {
      const card = getActiveReport().cards.find(c => c.id === id);
      if (!card.data[r]) card.data[r] = [];
      card.data[r][c] = val;
    }

    function openSettingsModal() {
      document.getElementById('settings-modal').classList.add('active');
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.remove('active');
    }

    function updatePrintFont(fontType) {
      currentPrintFont = fontType;
      if (fontType === 'mincho') {
        document.documentElement.style.setProperty('--print-font-family', '"Yu Mincho", "MS Mincho", "Hiragino Mincho ProN", serif');
      } else {
        document.documentElement.style.setProperty('--print-font-family', '-apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif');
      }
    }

    function changePointSize(delta) {
      let newSize = currentPointSize + delta;
      if (newSize < 7.0) newSize = 7.0;
      if (newSize > 20.0) newSize = 20.0;
      currentPointSize = Math.round(newSize * 10) / 10;
      document.getElementById('btn-point-size-display').innerText = currentPointSize.toFixed(1);
      document.documentElement.style.setProperty('--ui-font-size', `${currentPointSize}pt`);
      renderCards();
    }

    function openPrintModal() {
      document.getElementById('print-modal').classList.add('active');
    }

    function closePrintModal() {
      document.getElementById('print-modal').classList.remove('active');
    }

    function executePrint() {
      const lines = parseInt(document.getElementById('print-lines-slider').value, 10);
      const validLines = Math.min(Math.max(lines, 30), 50);
      
      document.documentElement.style.setProperty('--lines-per-page', validLines);
      closePrintModal();
      
      generatePrintContent();

      requestAnimationFrame(() => {
        window.print();
      });
    }

    function generatePrintContent() {
      const rep = getActiveReport();
      const target = document.getElementById('a4-target');
      target.innerHTML = '';
      target.className = 'print-content';

      if (!rep) return;

      rep.cards.forEach(card => {
        if (card.type === 'title') {
          const div = document.createElement('div');
          div.className = `out-title ${card.underline ? 'underline' : ''}`;
          div.innerText = card.text;
          target.appendChild(div);
        } else if (card.type === 'datetime') {
          const div = document.createElement('div');
          div.className = 'out-datetime';
          let dtStr = card.text || '';
          if (card.assignee) dtStr += (dtStr ? ' ' : '') + card.assignee;
          div.innerText = dtStr;
          target.appendChild(div);
        } else if (card.type === 'text') {
          const div = document.createElement('div');
          div.className = 'out-text';
          div.innerText = card.text;
          target.appendChild(div);
        } else if (card.type === 'table') {
          ensureSpans(card);
          const table = document.createElement('table');
          table.className = 'out-table';
          
          const totalW = (card.colWidths && card.colWidths.length === card.cols) 
            ? card.colWidths.reduce((a, b) => a + b, 0) 
            : card.cols * 85;

          if (card.colWidths) {
            const colgroup = document.createElement('colgroup');
            for (let c = 0; c < card.cols; c++) {
              const col = document.createElement('col');
              const w = card.colWidths[c] || 85;
              const pct = ((w / totalW) * 100).toFixed(2);
              col.style.width = `${pct}%`;
              colgroup.appendChild(col);
            }
            table.appendChild(colgroup);
          }

          for (let r = 0; r < card.rows; r++) {
            const tr = document.createElement('tr');
            const h = (card.rowHeights && card.rowHeights[r]) ? card.rowHeights[r] : 'auto';
            if (typeof h === 'number') tr.style.height = `${h}px`;

            for (let c = 0; c < card.cols; c++) {
              const span = card.spans[r][c];
              if (span.h) continue;

              const td = document.createElement('td');
              const val = (card.data[r] && card.data[r][c]) ? card.data[r][c] : '';
              td.className = getCellAlignmentClass(card, r, c, val);
              if (span.rs > 1) td.rowSpan = span.rs;
              if (span.cs > 1) td.colSpan = span.cs;
              td.innerText = val;
              tr.appendChild(td);
            }
            table.appendChild(tr);
          }
          target.appendChild(table);
        } else if (card.type === 'image') {
          const imgs = card.images || (card.src ? [card.src] : []);
          if (imgs.length > 0) {
            const box = document.createElement('div');
            box.className = 'out-image-box';
            
            const grid = document.createElement('div');
            grid.className = `image-grid count-${imgs.length}`;
            
            imgs.forEach(src => {
              const img = document.createElement('img');
              img.src = src;
              grid.appendChild(img);
            });
            
            box.appendChild(grid);
            target.appendChild(box);
          }
        }
      });
    }

    function escapeHtml(str) {
      if (typeof str !== 'string') return '';
      return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
    }
